# Low-VRAM smoke-test config for RTX 5090 32GB.
# Render this with scripts/render_config.sh 5090 before training.

model:
  model_path: "/Users/yursennezzari/workspace/models/ltx23/model.safetensors"
  text_encoder_path: "/Users/yursennezzari/workspace/models/gemma"
  training_mode: "lora"
  load_checkpoint: null

lora:
  rank: 8
  alpha: 8
  dropout: 0.0
  target_modules:
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"

training_strategy:
  name: "text_to_video"
  first_frame_conditioning_p: 0.5
  with_audio: false
  audio_latents_dir: "audio_latents"

optimization:
  learning_rate: 1e-4
  steps: 100
  batch_size: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer_type: "adamw8bit"
  scheduler_type: "linear"
  scheduler_params: {}
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  quantization: "int8-quanto"
  load_text_encoder_in_8bit: true

data:
  preprocessed_data_root: "/Users/yursennezzari/workspace/data/.precomputed"
  num_dataloader_workers: 1

validation:
  prompts:
    - "netflixinsidejob, Reagan Ridley in a clean adult animated office scene, expressive 2D character acting, crisp composition, Inside Job visual style."
  negative_prompt: "worst quality, inconsistent motion, blurry, jittery, distorted"
  images: null
  video_dims: [512, 512, 25]
  frame_rate: 24.0
  seed: 42
  inference_steps: 12
  interval: null
  guidance_scale: 4.0
  stg_scale: 1.0
  stg_blocks: [29]
  stg_mode: "stg_v"
  generate_audio: false
  skip_initial_validation: true

checkpoints:
  interval: 50
  keep_last_n: -1
  precision: "bfloat16"
  no_resume: false
  save_training_state: "minimal"

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

hub:
  push_to_hub: false
  hub_model_id: null

wandb:
  enabled: false
  project: "ltx-2-trainer"
  entity: null
  tags: ["ltx2", "lora", "insidejob", "5090", "smoke-test"]
  log_validation_videos: false

seed: 42
output_dir: "/Users/yursennezzari/workspace/runs/insidejob_5090"
